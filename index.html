<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pocket - AI 가계부 (Gemini 3)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #4a90e2; --secondary-color: #f5f7fa; --text-color: #333; --accent-color: #ff6b6b; --card-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--secondary-color); color: var(--text-color); margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        .month-nav { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .month-nav h1 { margin: 0; font-size: 1.6rem; color: var(--primary-color); min-width: 200px; }
        .nav-btn { cursor: pointer; border: none; background: white; padding: 8px 18px; border-radius: 12px; box-shadow: var(--card-shadow); font-weight: bold; }
        .action-btn { font-size: 0.8rem; padding: 8px 15px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; }
        .input-section { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 30px; border-top: 5px solid var(--primary-color); position: relative; }
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; resize: none; min-height: 80px; outline: none; }
        .add-btn { width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .add-btn:disabled { background: #ccc; cursor: wait; }
        .main-content { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; } }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
        .table-wrapper { overflow-x: auto; max-height: 500px; transition: all 0.3s ease; }
        .table-wrapper.collapsed { display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { position: sticky; top: 0; background: white; padding: 12px; border-bottom: 2px solid #f0f0f0; text-align: left; color: #888; }
        td { padding: 12px; border-bottom: 1px solid #f9f9f9; }
        .category-select { border: none; background: #f0f4f8; padding: 5px; border-radius: 6px; font-size: 0.8rem; width: 100%; cursor: pointer; }
        .total-amount { font-size: 1.6rem; font-weight: bold; color: var(--primary-color); text-align: right; margin-top: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 95%; max-width: 450px; }

        .memo-box { width: 100%; min-height: 100px; border: 1px dashed #ddd; border-radius: 10px; padding: 10px; font-size: 0.9rem; background: #fffcf0; resize: none; outline: none; margin-top: 10px; }
        .ai-feedback-container { background: #f0f7ff; border-radius: 15px; padding: 15px; margin-top: 15px; border-left: 5px solid #4a90e2; font-size: 0.85rem; line-height: 1.6; }
        .feedback-btn { width: 100%; padding: 10px; background: #6c5ce7; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="month-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
            <h1 id="current-month-display"></h1>
            <button class="nav-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div id="sync-status" style="font-size: 0.7rem; color: #2ecc71; margin-bottom: 10px;">● Cloud Syncing...</div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 15px;">
            <button class="action-btn" onclick="openSettings()">⚙️ 설정</button>
            <button class="action-btn" onclick="exportToCSV()">📤 CSV 내보내기</button>
        </div>
    </header>

    <div class="input-section">
        <textarea id="natural-input" placeholder="예: 3/11 택시 4500, 스타벅스 5000"></textarea>
        <button id="add-btn" class="add-btn" onclick="handleAdd()">기록하기 (Gemini 3 분석)</button>
        <div id="ai-loader" style="display:none; text-align:center; font-size:0.8rem; color:var(--primary-color); margin-top:5px;">Gemini 3가 분석 중입니다...</div>
    </div>

    <div class="main-content">
        <section class="card">
            <!-- 지출 항목 접기/펴기 기능 -->
            <div class="table-header">
                <h3 style="margin:0; font-size: 1.1rem;">📋 지출 내역</h3>
                <button class="action-btn" id="toggle-table-btn" onclick="toggleTable()">숨기기</button>
            </div>
            <div class="table-wrapper" id="table-wrapper">
                <table>
                    <thead><tr><th>날짜</th><th>항목</th><th style="width:140px;">카테고리</th><th>금액</th><th></th></tr></thead>
                    <tbody id="expense-list"></tbody>
                </table>
            </div>
        </section>
        <div class="stats-side">
            <section class="card">
                <div style="height: 250px;"><canvas id="expenseChart"></canvas></div>
                <div id="summary-list" style="margin-top: 15px;"></div>
                <div id="total-display" class="total-amount">0원</div>
            </section>

            <section class="card">
                <h3 style="margin:0; font-size: 1rem;">📝 월별 메모</h3>
                <textarea id="month-memo" class="memo-box" placeholder="이달의 다짐이나 메모를 입력하세요..." oninput="handleMemoInput()"></textarea>
            </section>

            <section class="card">
                <h3 style="margin:0; font-size: 1rem;">💡 AI 소비 분석</h3>
                <div id="ai-feedback-text" class="ai-feedback-container">지출 내역을 기반으로 Gemini 3의 피드백을 받아보세요.</div>
                <button id="feedback-btn" class="feedback-btn" onclick="getAIFeedback()">이달의 피드백 받기</button>
            </section>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>설정</h3>
        <label style="font-size:0.85rem; font-weight:bold;">카테고리 관리</label>
        <div id="category-manager-list" style="margin: 10px 0; max-height: 150px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 10px;"></div>
        <div style="display: flex; gap: 5px; margin-bottom: 20px;">
            <input type="text" id="new-cat-input" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:8px;" placeholder="새 카테고리">
            <button onclick="addCategory()" style="padding:8px 15px; background:var(--primary-color); color:white; border:none; border-radius:8px;">추가</button>
        </div>
        
        <label style="font-size:0.85rem; font-weight:bold;">Gemini API Key</label>
        <div id="key-status-msg" style="font-size:0.75rem; color:#888; margin-bottom:5px;"></div>
        <div style="display: flex; gap: 5px;">
            <input type="password" id="gemini-key-input" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:8px;" placeholder="AIzaSy...">
            <button onclick="saveApiKey()" style="padding:8px 15px; background:#444; color:white; border:none; border-radius:8px;">저장</button>
        </div>
        <button onclick="closeSettings()" style="width:100%; margin-top:20px; padding:12px; background:#eee; border:none; border-radius:12px; cursor:pointer;">닫기</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC7bE0ICTArzvg7qJXHGNdhWPZZtyT6v1c",
        authDomain: "smart-pocket-ea308.firebaseapp.com",
        projectId: "smart-pocket-ea308",
        storageBucket: "smart-pocket-ea308.firebasestorage.app",
        messagingSenderId: "165999635532",
        appId: "1:165999635532:web:d73543e1044437630758e9",
        measurementId: "G-E75HCJPHW3",
        databaseURL: "https://smart-pocket-ea308-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        viewDate: new Date(),
        expenses: [],
        categories: ['식비', '교통비', '쇼핑/미용', '공과금', '취미', '생활용품', '구독/디지털'],
        memos: {},
        geminiKey: localStorage.getItem('sp_gemini_key') || "" 
    };

    let myChart = null;
    const modelName = "gemini-3-flash-preview";

    // --- 기능 추가: 지출 내역 토글 ---
    function toggleTable() {
        const wrapper = document.getElementById('table-wrapper');
        const btn = document.getElementById('toggle-table-btn');
        if (wrapper.classList.contains('collapsed')) {
            wrapper.classList.remove('collapsed');
            btn.textContent = "숨기기";
        } else {
            wrapper.classList.add('collapsed');
            btn.textContent = "보기";
        }
    }

    async function callGemini(prompt) {
        if (!state.geminiKey) return null;
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${state.geminiKey}`;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text.trim();
        } catch (e) {
            console.error("AI 통신 실패:", e);
            return null;
        }
    }

    function handleMemoInput() {
        const key = `${state.viewDate.getFullYear()}-${state.viewDate.getMonth() + 1}`;
        state.memos[key] = document.getElementById('month-memo').value;
        db.ref('memos').set(state.memos);
    }

    async function getAIFeedback() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        const currentData = state.expenses.filter(ex => ex.year === year && ex.month === month);
        if (currentData.length === 0) { alert("지출 내역이 있어야 분석이 가능합니다."); return; }
        const feedbackBox = document.getElementById('ai-feedback-text');
        const btn = document.getElementById('feedback-btn');
        feedbackBox.innerText = "Gemini 3가 소비 패턴을 분석 중입니다...";
        btn.disabled = true;
        const dataSummary = currentData.map(d => `${d.item}(${d.category}): ${d.amount}원`).join(", ");
        const prompt = `너는 전문 재무 설계사야. 나의 이번 달 지출 내역은 다음과 같아: [${dataSummary}]. 이 내역을 분석해서 1)칭찬할 점, 2)아쉬운 점, 3)다음 달을 위한 절약 팁을 친구에게 말하듯 친절하게 한국어로 요약해줘.`;
        const result = await callGemini(prompt);
        feedbackBox.innerText = result || "피드백을 생성할 수 없습니다. API 키를 확인하세요.";
        btn.disabled = false;
    }

    async function handleAdd() {
        const inp = document.getElementById('natural-input');
        if (!inp.value.trim()) return;
        const loader = document.getElementById('ai-loader');
        const btn = document.getElementById('add-btn');
        btn.disabled = true;
        loader.style.display = 'block';
        const segments = inp.value.split(/[,|\n]/).map(s => s.trim()).filter(s => s.length > 0);
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        let day = new Date().getDate();
        for (const seg of segments) {
            let text = seg;
            const dateMatch = text.match(/(\d{1,2})[월\/](\d{1,2})일?/);
            if (dateMatch) { day = parseInt(dateMatch[2]); text = text.replace(dateMatch[0], "").trim(); }
            const amtMatch = text.match(/(\d[\d,.]*)\s*(만원|원)?/g);
            if (amtMatch) {
                const last = amtMatch[amtMatch.length - 1];
                let amt = parseFloat(last.replace(/[^\d.]/g, ""));
                if (last.includes("만원")) amt *= 10000;
                text = text.replace(last, "").trim() || "기타";
                const catPrompt = `"${text}"를 [${state.categories.join(", ")}] 중 하나로 분류해. 설명 없이 단어만 답해.`;
                const cleanedText = await callGemini(catPrompt);
                const category = state.categories.includes(cleanedText) ? cleanedText : state.categories[0];
                const newEx = { id: Date.now() + Math.random(), year, month, day, item: text, amount: amt, category };
                state.expenses.push(newEx);
            }
        }
        inp.value = '';
        pushToCloud();
        btn.disabled = false;
        loader.style.display = 'none';
        render();
    }

    function initSync() {
        db.ref('/').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                state.expenses = val.expenses ? Object.values(val.expenses) : [];
                state.categories = val.categories || state.categories;
                state.memos = val.memos || {};
                render();
            }
        });
    }

    function pushToCloud() {
        db.ref('expenses').set(state.expenses);
        db.ref('categories').set(state.categories);
        db.ref('memos').set(state.memos);
    }

    function render() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        document.getElementById('current-month-display').textContent = `${year}년 ${month}월`;
        const memoKey = `${year}-${month}`;
        document.getElementById('month-memo').value = state.memos[memoKey] || "";
        let data = state.expenses.filter(ex => ex.year === year && ex.month === month);
        const listEl = document.getElementById('expense-list');
        listEl.innerHTML = '';
        data.sort((a,b) => b.day - a.day).forEach(ex => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${ex.month}/${ex.day}</td>
                <td>${ex.item}</td>
                <td>
                    <select class="category-select" onchange="updateExCat(${ex.id}, this.value)">
                        ${state.categories.map(c => `<option value="${c}" ${ex.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                </td>
                <td>${ex.amount.toLocaleString()}원</td>
                <td><button onclick="deleteEx(${ex.id})" style="border:none; background:none; color:#ccc; cursor:pointer;">✕</button></td>
            `;
            listEl.appendChild(tr);
        });
        updateStats(data);
    }

    // --- 기능 추가: 퍼센티지 표시 로직 포함 ---
    function updateStats(data) {
        const stats = data.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + curr.amount; return acc; }, {});
        const summaryEl = document.getElementById('summary-list');
        summaryEl.innerHTML = '';
        let total = 0;
        Object.values(stats).forEach(amt => total += amt);

        Object.entries(stats).sort((a,b) => b[1]-a[1]).forEach(([cat, amt]) => {
            const percentage = total > 0 ? ((amt / total) * 100).toFixed(1) : 0;
            summaryEl.innerHTML += `
                <div style="display:flex; justify-content:space-between; padding:5px; font-size:0.9rem; border-bottom: 1px solid #f0f0f0;">
                    <span>${cat} <small style="color:#888;">(${percentage}%)</small></span>
                    <span style="font-weight:bold;">${amt.toLocaleString()}원</span>
                </div>`;
        });
        document.getElementById('total-display').textContent = `${total.toLocaleString()}원`;
        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (myChart) myChart.destroy();
        if (Object.keys(stats).length > 0) {
            myChart = new Chart(ctx, { type: 'doughnut', data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#4a90e2', '#ff6b6b', '#feca57', '#1dd1a1', '#a29bfe', '#ff9f43', '#ee5253', '#0abde3', '#10ac84', '#576574'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' } });
        }
    }

    function exportToCSV() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        const currentData = state.expenses.filter(ex => ex.year === year && ex.month === month);
        const stats = currentData.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + curr.amount; return acc; }, {});
        const totalAmount = Object.values(stats).reduce((a, b) => a + b, 0);
        const statsArray = Object.entries(stats).sort((a,b) => b[1]-a[1]);
        let csv = "\uFEFF날짜,항목,카테고리,금액,,[카테고리 요약],금액,비중(%)\n";
        const maxRows = Math.max(currentData.length, statsArray.length + 1);
        for (let i = 0; i < maxRows; i++) {
            let row = [];
            if (i < currentData.length) {
                const ex = currentData[i];
                row.push(`${ex.year}-${ex.month}-${ex.day}`, `"${ex.item.replace(/"/g, '""')}"`, ex.category, ex.amount);
            } else { row.push("", "", "", ""); }
            row.push("");
            if (i < statsArray.length) {
                const [cat, amt] = statsArray[i];
                const percent = totalAmount > 0 ? ((amt / totalAmount) * 100).toFixed(1) : 0;
                row.push(cat, amt, percent + "%");
            } else if (i === statsArray.length && totalAmount > 0) {
                row.push("총 지출 합계", totalAmount, "100%");
            }
            csv += row.join(",") + "\n";
        }
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = `${year}년_${month}월_가계부.csv`; link.click();
    }

    function openSettings() {
        document.getElementById('settings-modal').style.display = 'flex';
        const list = document.getElementById('category-manager-list');
        list.innerHTML = state.categories.map(c => `<div style="display:flex; justify-content:space-between; padding:5px 0;"><span>${c}</span><button onclick="removeCategory('${c}')" style="color:#ff6b6b; border:none; background:none; cursor:pointer;">삭제</button></div>`).join('');
        document.getElementById('key-status-msg').innerHTML = state.geminiKey ? "✅ 키 저장됨" : "❌ 키 없음";
    }
    function saveApiKey() { const k = document.getElementById('gemini-key-input').value.trim(); if(k) { state.geminiKey = k; localStorage.setItem('sp_gemini_key', k); alert("키 저장 완료!"); openSettings(); } }
    function addCategory() { const v = document.getElementById('new-cat-input').value.trim(); if(v && !state.categories.includes(v)) { state.categories.push(v); pushToCloud(); openSettings(); document.getElementById('new-cat-input').value = ""; } }
    function removeCategory(c) { if(state.categories.length > 1 && confirm(`'${c}'를 삭제할까요?`)) { state.categories = state.categories.filter(x => x !== c); pushToCloud(); openSettings(); } }
    function deleteEx(id) { if(confirm('삭제하시겠습니까?')) { state.expenses = state.expenses.filter(e => e.id !== id); pushToCloud(); } }
    function updateExCat(id, cat) { state.expenses = state.expenses.map(e => e.id === id ? {...e, category: cat} : e); pushToCloud(); }
    function changeMonth(d) { state.viewDate.setMonth(state.viewDate.getMonth() + d); render(); }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    window.onload = initSync;
</script>
</body>
</html>
