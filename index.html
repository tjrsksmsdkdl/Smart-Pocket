<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pocket - 클라우드 & AI 가계부</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4a90e2; --secondary-color: #f5f7fa; --text-color: #333;
            --accent-color: #ff6b6b; --card-shadow: 0 4px 15px rgba(0,0,0,0.08); --ai-bg: #f8f9ff;
        }
        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--secondary-color); color: var(--text-color); margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        .month-nav { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .month-nav h1 { margin: 0; font-size: 1.6rem; color: var(--primary-color); min-width: 200px; }
        .nav-btn { cursor: pointer; border: none; background: white; padding: 8px 18px; border-radius: 12px; box-shadow: var(--card-shadow); font-weight: bold; }
        
        .top-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .action-btn { font-size: 0.8rem; padding: 8px 15px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .input-section { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 30px; border-top: 5px solid var(--primary-color); position: relative; }
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; resize: none; min-height: 80px; outline: none; }
        .add-btn { width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 1rem; transition: 0.2s; }
        .add-btn:disabled { background: #ccc; cursor: not-allowed; }

        .main-content { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; } }

        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
        .card h2 { margin-top: 0; font-size: 1.1rem; margin-bottom: 15px; border-left: 5px solid var(--primary-color); padding-left: 10px; }

        .ai-report { background: var(--ai-bg); border: 1px solid #e1e7ff; display: none; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .table-wrapper { overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { position: sticky; top: 0; background: white; padding: 12px; border-bottom: 2px solid #f0f0f0; text-align: left; color: #888; }
        td { padding: 12px; border-bottom: 1px solid #f9f9f9; }

        .category-select { border: none; background: #f0f4f8; padding: 5px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; width: 100%; }
        .total-amount { font-size: 1.6rem; font-weight: bold; color: var(--primary-color); text-align: right; margin-top: 20px; }

        /* 설정 모달 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 95%; max-width: 450px; }
        .cat-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .cat-actions { display: flex; gap: 8px; }
        .edit-btn { color: var(--primary-color); cursor: pointer; border: none; background: none; font-size: 0.8rem; }
        .delete-btn { color: var(--accent-color); cursor: pointer; border: none; background: none; font-size: 0.8rem; }
        
        /* API 키 설정 영역 */
        .api-key-box { margin-top: 20px; padding-top: 15px; border-top: 2px dashed #eee; }
        .key-status { font-size: 0.75rem; color: #666; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="month-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
            <h1 id="current-month-display"></h1>
            <button class="nav-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div id="sync-status" style="font-size: 0.7rem; color: #2ecc71; margin-bottom: 10px;">● Cloud Syncing...</div>
        <div class="top-actions">
            <button class="action-btn" onclick="openSettings()">⚙️ 설정 (카테고리/API)</button>
            <button class="action-btn" onclick="exportToCSV()">📤 내보내기 (CSV)</button>
            <button class="action-btn" style="background: var(--primary-color); color: white;" onclick="generateAIAnalysis()">✨ AI 분석 리포트</button>
        </div>
    </header>

    <div id="ai-report-box" class="ai-report card">
        <h2>✨ AI 지출 분석 리포트</h2>
        <div id="ai-content"></div>
    </div>

    <div class="input-section">
        <textarea id="natural-input" placeholder="예: 3/11 택시 4500, 밥 9000 (쉼표로 구분 가능)"></textarea>
        <button id="add-btn" class="add-btn" onclick="handleAdd()">기록하기 (Gemini AI 분석)</button>
        <div id="ai-loader" style="display:none; text-align:center; font-size:0.8rem; color:var(--primary-color); margin-top:5px;">Gemini AI가 카테고리를 분류하고 있습니다...</div>
    </div>

    <div class="main-content">
        <section class="card">
            <h2>기록 내역 <span id="filter-label" style="font-size: 0.7rem; color:var(--primary-color); display:none;">(필터 적용 중)</span></h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>날짜</th><th>항목</th><th style="width:120px;">카테고리</th><th>금액</th><th></th></tr>
                    </thead>
                    <tbody id="expense-list"></tbody>
                </table>
            </div>
        </section>

        <div class="stats-side">
            <section class="card">
                <h2>통계</h2>
                <div id="chart-wrapper" style="height: 250px;"><canvas id="expenseChart"></canvas></div>
                <div id="summary-list"></div>
                <div id="total-display" class="total-amount">0원</div>
            </section>
            <section class="card">
                <h2>월간 메모</h2>
                <textarea id="month-memo" style="width: 100%; min-height: 100px; border: 1px solid #eee; padding: 12px; background: #fffdf2; border-radius: 12px;" placeholder="메모를 적어보세요..." oninput="saveMemo()"></textarea>
            </section>
        </div>
    </div>
</div>

<!-- 설정 모달 -->
<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>설정 관리</h3>
        
        <!-- 카테고리 관리 -->
        <label style="font-size: 0.85rem; font-weight: bold;">카테고리 목록</label>
        <div id="category-manager-list" style="margin: 10px 0; max-height: 180px; overflow-y: auto;"></div>
        <div style="display: flex; gap: 5px; margin-bottom: 20px;">
            <input type="text" id="new-cat-input" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:8px;" placeholder="새 카테고리">
            <button onclick="addCategory()" style="padding:8px 15px; background:var(--primary-color); color:white; border:none; border-radius:8px;">추가</button>
        </div>

        <!-- Gemini API Key 관리 -->
        <div class="api-key-box">
            <label style="font-size: 0.85rem; font-weight: bold;">Gemini API Key (보안 유지)</label>
            <div id="key-status-msg" class="key-status">키를 입력해야 AI 기능을 사용할 수 있습니다.</div>
            <div style="display: flex; gap: 5px;">
                <input type="password" id="gemini-key-input" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:8px;" placeholder="AIzaSy...">
                <button onclick="saveApiKey()" style="padding:8px 15px; background:#444; color:white; border:none; border-radius:8px;">저장</button>
            </div>
        </div>

        <button onclick="closeSettings()" style="width:100%; margin-top:20px; padding:12px; border:none; border-radius:12px; cursor:pointer;">닫기</button>
    </div>
</div>

<script>
    // --- 1. 설정 (Firebase) ---
    const firebaseConfig = {
        apiKey: "AIzaSyC7bE0ICTArzvg7qJXHGNdhWPZZtyT6v1c",
        authDomain: "smart-pocket-ea308.firebaseapp.com",
        projectId: "smart-pocket-ea308",
        storageBucket: "smart-pocket-ea308.firebasestorage.app",
        messagingSenderId: "165999635532",
        appId: "1:165999635532:web:d73543e1044437630758e9",
        measurementId: "G-E75HCJPHW3",
        databaseURL: "https://smart-pocket-ea308-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        viewDate: new Date(),
        expenses: [],
        categories: ['식비', '교통비', '쇼핑/미용', '공과금', '취미', '생활용품', '구독/디지털'],
        memos: {},
        filter: null,
        geminiKey: localStorage.getItem('sp_gemini_key') || "" // 브라우저에서 키 로드
    };

    let myChart = null;

    // --- 2. 실시간 동기화 ---
    function initSync() {
        db.ref('/').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                state.expenses = val.expenses ? Object.values(val.expenses) : [];
                state.categories = val.categories || state.categories;
                state.memos = val.memos || {};
                render();
            }
        });
    }

    function pushToCloud() {
        db.ref('expenses').set(state.expenses);
        db.ref('categories').set(state.categories);
        db.ref('memos').set(state.memos);
    }

    // --- 3. Gemini AI 분류 ---
    async function askGeminiToCategorize(itemText) {
        if (!state.geminiKey) return state.categories[0]; // 키 없으면 기본값

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.geminiKey}`;
        const prompt = `가계부 항목 "${itemText}"를 다음 카테고리 중 하나로 분류해줘: [${state.categories.join(", ")}]. 
        아무런 설명 없이 딱 한 단어(카테고리 이름)만 대답해.`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            const result = data.candidates[0].content.parts[0].text.trim();
            return state.categories.includes(result) ? result : state.categories[0];
        } catch (e) {
            console.error("Gemini Error:", e);
            return state.categories[0];
        }
    }

    // --- 4. 입력 핸들러 ---
    async function handleAdd() {
        const inp = document.getElementById('natural-input');
        const loader = document.getElementById('ai-loader');
        const btn = document.getElementById('add-btn');

        if (!inp.value.trim()) return;
        
        btn.disabled = true;
        loader.style.display = 'block';

        const segments = inp.value.split(/[,|\n]/).map(s => s.trim()).filter(s => s.length > 0);
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        let day = new Date().getDate();

        const results = [];
        for (const seg of segments) {
            let text = seg;
            const dateMatch = text.match(/(\d{1,2})[월\/](\d{1,2})일?/);
            if (dateMatch) { day = parseInt(dateMatch[2]); text = text.replace(dateMatch[0], "").trim(); }

            const amtMatch = text.match(/(\d[\d,.]*)\s*(만원|원)?/g);
            if (amtMatch) {
                const last = amtMatch[amtMatch.length - 1];
                let amt = parseFloat(last.replace(/[^\d.]/g, ""));
                if (last.includes("만원")) amt *= 10000;
                text = text.replace(last, "").trim();
                
                const category = await askGeminiToCategorize(text || "기타");
                results.push({ id: Date.now() + Math.random(), year, month, day, item: text || "기타", amount: amt, category });
            }
        }

        if (results.length > 0) {
            state.expenses = [...state.expenses, ...results];
            inp.value = '';
            pushToCloud();
        }
        
        btn.disabled = false;
        loader.style.display = 'none';
    }

    // --- 5. 렌더링 및 통계 ---
    function render() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        document.getElementById('current-month-display').textContent = `${year}년 ${month}월`;

        let data = state.expenses.filter(ex => ex.year === year && ex.month === month);
        if (state.filter) data = data.filter(ex => ex.category === state.filter);
        document.getElementById('filter-label').style.display = state.filter ? 'inline' : 'none';

        const listEl = document.getElementById('expense-list');
        listEl.innerHTML = '';
        data.sort((a,b) => b.day - a.day).forEach(ex => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${ex.month}/${ex.day}</td>
                <td style="font-weight:500">${ex.item}</td>
                <td><select class="category-select" onchange="updateExCat(${ex.id}, this.value)">
                    ${state.categories.map(c => `<option value="${c}" ${ex.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select></td>
                <td>${ex.amount.toLocaleString()}원</td>
                <td><button onclick="deleteEx(${ex.id})" style="border:none; background:none; cursor:pointer; color:#ccc;">✕</button></td>
            `;
            listEl.appendChild(tr);
        });

        updateStats(data);
        document.getElementById('month-memo').value = state.memos[`${year}-${month}`] || "";
    }

    function updateStats(data) {
        const stats = data.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + curr.amount; return acc; }, {});
        const summaryEl = document.getElementById('summary-list');
        summaryEl.innerHTML = '';
        let total = 0;
        
        Object.entries(stats).sort((a,b) => b[1]-a[1]).forEach(([cat, amt]) => {
            total += amt;
            const div = document.createElement('div');
            div.style.cssText = `display:flex; justify-content:space-between; padding:8px; cursor:pointer; border-radius:8px; font-size:0.9rem; background:${state.filter===cat?'#eef5ff':'transparent'}`;
            div.onclick = () => { state.filter = (state.filter === cat ? null : cat); render(); };
            div.innerHTML = `<span>${cat}</span><span>${amt.toLocaleString()}원</span>`;
            summaryEl.appendChild(div);
        });
        document.getElementById('total-display').textContent = `${total.toLocaleString()}원`;

        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (myChart) myChart.destroy();
        if (Object.keys(stats).length > 0) {
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#4a90e2', '#ff6b6b', '#feca57', '#1dd1a1', '#a29bfe', '#ff9f43', '#ee5253', '#0abde3', '#10ac84', '#576574'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
            });
        }
    }

    // --- 6. 액션 함수들 ---
    function deleteEx(id) { if(confirm('삭제하시겠습니까?')) { state.expenses = state.expenses.filter(e => e.id !== id); pushToCloud(); } }
    
    function updateExCat(id, newCat) {
        state.expenses = state.expenses.map(ex => ex.id === id ? {...ex, category: newCat} : ex);
        pushToCloud();
    }

    function changeMonth(d) { state.viewDate.setMonth(state.viewDate.getMonth() + d); state.filter = null; render(); }
    
    function saveMemo() {
        const key = `${state.viewDate.getFullYear()}-${state.viewDate.getMonth()+1}`;
        state.memos[key] = document.getElementById('month-memo').value;
        pushToCloud();
    }

    function generateAIAnalysis() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        const data = state.expenses.filter(ex => ex.year === year && ex.month === month);
        if (data.length === 0) return alert('기록이 없습니다.');
        const total = data.reduce((s, e) => s + e.amount, 0);
        const stats = data.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + curr.amount; return acc; }, {});
        const top = Object.entries(stats).sort((a,b) => b[1]-a[1])[0];

        document.getElementById('ai-report-box').style.display = 'block';
        document.getElementById('ai-content').innerHTML = `
            <p><b>👏 이번 달 리뷰:</b> ${total.toLocaleString()}원을 지출하셨고, 총 ${data.length}건의 소비가 있었습니다.</p>
            <p><b>⚠️ 지출 비중:</b> <b>${top[0]}</b> 항목이 전체의 ${Math.round(top[1]/total*100)}%로 가장 높은 비중을 차지합니다.</p>
            <p><b>💡 AI 한마디:</b> ${top[0]} 관련 소비를 다음 달에는 조금 줄여보는 목표를 가져보세요!</p>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exportToCSV() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        const data = state.expenses.filter(ex => ex.year === year && ex.month === month).sort((a,b) => a.day - b.day);
        const stats = data.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + curr.amount; return acc; }, {});
        const totalSum = Object.values(stats).reduce((a, b) => a + b, 0);
        const sortedCats = Object.entries(stats).sort((a,b) => b[1] - a[1]);

        let csv = "\uFEFF날짜,항목,카테고리,금액,,카테고리 요약,금액,비중(%)\n";
        const rows = Math.max(data.length, sortedCats.length);
        for(let i=0; i<rows; i++) {
            if(data[i]) csv += `${data[i].year}-${data[i].month}-${data[i].day},${data[i].item},${data[i].category},${data[i].amount}`;
            else csv += ",,,";
            csv += ",";
            if(sortedCats[i]) csv += `${sortedCats[i][0]},${sortedCats[i][1]},${((sortedCats[i][1]/totalSum)*100).toFixed(1)}%`;
            csv += "\n";
        }
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = `가계부_${year}_${month}.csv`;
        link.click();
    }

    // --- 7. 설정 및 API 관리 ---
    function openSettings() {
        document.getElementById('settings-modal').style.display = 'flex';
        document.getElementById('category-manager-list').innerHTML = state.categories.map(c => `
            <div class="cat-item">
                <span>${c}</span>
                <div class="cat-actions">
                    <button class="edit-btn" onclick="renameCategory('${c}')">수정</button>
                    <button class="delete-btn" onclick="removeCategory('${c}')">삭제</button>
                </div>
            </div>
        `).join('');
        
        const status = state.geminiKey ? "✅ 키가 안전하게 저장되어 있습니다." : "❌ 키가 없습니다 (AI 기능 미작동)";
        document.getElementById('key-status-msg').textContent = status;
    }

    function saveApiKey() {
        const key = document.getElementById('gemini-key-input').value.trim();
        if(key) {
            state.geminiKey = key;
            localStorage.setItem('sp_gemini_key', key);
            document.getElementById('key-status-msg').textContent = "✅ 키가 저장되었습니다!";
            document.getElementById('gemini-key-input').value = "";
        }
    }

    function renameCategory(old) {
        const v = prompt('수정할 이름을 입력하세요:', old);
        if(v && v !== old) {
            state.categories = state.categories.map(c => c === old ? v : c);
            state.expenses = state.expenses.map(e => e.category === old ? {...e, category: v} : e);
            pushToCloud(); openSettings();
        }
    }

    function removeCategory(c) {
        if(state.categories.length > 1 && confirm('정말 삭제하시겠습니까?')) {
            state.categories = state.categories.filter(x => x !== c);
            pushToCloud(); openSettings();
        }
    }

    function addCategory() {
        const v = document.getElementById('new-cat-input').value.trim();
        if(v && !state.categories.includes(v)) { state.categories.push(v); document.getElementById('new-cat-input').value = ''; pushToCloud(); openSettings(); }
    }

    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    window.onclick = (e) => { if(e.target.className === 'modal') closeSettings(); }
    window.onload = initSync;
</script>

</body>
</html>
