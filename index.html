<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pocket - AI 가계부 최종형</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #4a90e2; --secondary-color: #f5f7fa; --text-color: #333; --accent-color: #ff6b6b; --card-shadow: 0 4px 15px rgba(0,0,0,0.08); --ai-bg: #f8f9ff; }
        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--secondary-color); color: var(--text-color); margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        .month-nav { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .month-nav h1 { margin: 0; font-size: 1.6rem; color: var(--primary-color); min-width: 200px; }
        .nav-btn { cursor: pointer; border: none; background: white; padding: 8px 18px; border-radius: 12px; box-shadow: var(--card-shadow); font-weight: bold; }
        .top-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .action-btn { font-size: 0.8rem; padding: 8px 15px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; }
        .input-section { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 30px; border-top: 5px solid var(--primary-color); position: relative; }
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; resize: none; min-height: 80px; outline: none; }
        .add-btn { width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .add-btn:disabled { background: #ccc; cursor: wait; }
        .main-content { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; } }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
        .table-wrapper { overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { position: sticky; top: 0; background: white; padding: 12px; border-bottom: 2px solid #f0f0f0; text-align: left; color: #888; }
        td { padding: 12px; border-bottom: 1px solid #f9f9f9; }
        .category-select { border: none; background: #f0f4f8; padding: 5px; border-radius: 6px; font-size: 0.8rem; width: 100%; cursor: pointer; }
        .total-amount { font-size: 1.6rem; font-weight: bold; color: var(--primary-color); text-align: right; margin-top: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 95%; max-width: 450px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="month-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
            <h1 id="current-month-display"></h1>
            <button class="nav-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div id="sync-status" style="font-size: 0.7rem; color: #2ecc71; margin-bottom: 10px;">● Cloud Syncing...</div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 15px;">
            <button class="action-btn" onclick="openSettings()">⚙️ 설정</button>
            <button class="action-btn" onclick="exportToCSV()">📤 CSV 내보내기</button>
            <button class="action-btn" style="background: var(--primary-color); color: white;" onclick="generateAIAnalysis()">✨ AI 분석 리포트</button>
        </div>
    </header>

    <div class="input-section">
        <textarea id="natural-input" placeholder="3/11 택시 4500, 스타벅스 5000"></textarea>
        <button id="add-btn" class="add-btn" onclick="handleAdd()">기록하기 (Gemini AI 분석)</button>
        <div id="ai-loader" style="display:none; text-align:center; font-size:0.8rem; color:var(--primary-color); margin-top:5px;">AI가 항목을 분석하고 있습니다...</div>
    </div>

    <div class="main-content">
        <section class="card">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>날짜</th><th>항목</th><th style="width:140px;">카테고리</th><th>금액</th><th></th></tr></thead>
                    <tbody id="expense-list"></tbody>
                </table>
            </div>
        </section>
        <div class="stats-side">
            <section class="card">
                <div style="height: 250px;"><canvas id="expenseChart"></canvas></div>
                <div id="summary-list"></div>
                <div id="total-display" class="total-amount">0원</div>
            </section>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>설정</h3>
        <div id="category-manager-list" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto;"></div>
        <div style="display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 15px;">
            <input type="text" id="new-cat-input" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:8px;">
            <button onclick="addCategory()" style="padding:8px; background:var(--primary-color); color:white; border:none; border-radius:8px;">추가</button>
        </div>
        <div>
            <label style="font-size:0.8rem; font-weight:bold;">Gemini API Key</label>
            <div style="display: flex; gap: 5px;">
                <input type="password" id="gemini-key-input" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:8px;" placeholder="AIzaSy...">
                <button onclick="saveApiKey()" style="padding:8px; background:#444; color:white; border:none; border-radius:8px;">저장</button>
            </div>
        </div>
        <button onclick="closeSettings()" style="width:100%; margin-top:20px; padding:12px; border:none; border-radius:12px; cursor:pointer;">닫기</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC7bE0ICTArzvg7qJXHGNdhWPZZtyT6v1c",
        authDomain: "smart-pocket-ea308.firebaseapp.com",
        projectId: "smart-pocket-ea308",
        storageBucket: "smart-pocket-ea308.firebasestorage.app",
        messagingSenderId: "165999635532",
        appId: "1:165999635532:web:d73543e1044437630758e9",
        measurementId: "G-E75HCJPHW3",
        databaseURL: "https://smart-pocket-ea308-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        viewDate: new Date(),
        expenses: [],
        categories: ['식비', '교통비', '쇼핑/미용', '공과금', '취미', '생활용품', '구독/디지털'],
        geminiKey: localStorage.getItem('sp_gemini_key') || "" 
    };

    let myChart = null;

    // AI가 안될 때를 대비한 강력한 로컬 키워드 사전
    const keywordMap = {
        '식비': ['밥', '식당', '카페', '커피', '마트', '치킨', '배달', '점심', '저녁', '사과', '빵'],
        '교통비': ['택시', '버스', '지하철', '주유', '기차', '대리', '주차'],
        '생활용품': ['생리대', '휴지', '세제', '다이소', '물티슈', '샴푸', '비누', '치약'],
        '쇼핑/미용': ['가방', '옷', '미용실', '화장품', '백화점', '신발'],
        '취미': ['영화', '게임', '도서', '헬스', '유튜브', '넷플릭스'],
        '공과금': ['전기', '가스', '수도', '관리비', '보험', '통신비', '세금']
    };

    // 1. AI 카테고리 분류 (v1 경로로 수정)
    async function askGeminiToCategorize(itemText) {
        // AI 시도 전 로컬 키워드 검사 (즉각적인 정확도 확보)
        for (let [cat, keys] of Object.entries(keywordMap)) {
            if (state.categories.includes(cat) && keys.some(k => itemText.includes(k))) return cat;
        }

        if (!state.geminiKey) return state.categories[0];

        // 최신 v1 경로 사용
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${state.geminiKey}`;
        
        const prompt = `가계부 항목 "${itemText}"를 다음 카테고리 중 하나로만 대답해: [${state.categories.join(", ")}]. 
        규칙: 아무런 설명 없이 딱 한 단어만 대답할 것.`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!response.ok) {
                const err = await response.json();
                console.error("AI 에러 상세:", err);
                return state.categories[0];
            }

            const data = await response.json();
            let aiResult = data.candidates[0].content.parts[0].text.trim();
            aiResult = aiResult.replace(/[^\wㄱ-ㅎㅏ-ㅣ가-힣/]/g, "").trim();
            
            return state.categories.includes(aiResult) ? aiResult : state.categories[0];
        } catch (e) {
            console.error("AI 요청 실패:", e);
            return state.categories[0];
        }
    }

    // 2. 입력 핸들러 (비동기 처리)
    async function handleAdd() {
        const inp = document.getElementById('natural-input');
        if (!inp.value.trim()) return;

        const loader = document.getElementById('ai-loader');
        const btn = document.getElementById('add-btn');
        btn.disabled = true;
        loader.style.display = 'block';

        const segments = inp.value.split(/[,|\n]/).map(s => s.trim()).filter(s => s.length > 0);
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        let day = new Date().getDate();

        for (const seg of segments) {
            let text = seg;
            const dateMatch = text.match(/(\d{1,2})[월\/](\d{1,2})일?/);
            if (dateMatch) { day = parseInt(dateMatch[2]); text = text.replace(dateMatch[0], "").trim(); }

            const amtMatch = text.match(/(\d[\d,.]*)\s*(만원|원)?/g);
            if (amtMatch) {
                const last = amtMatch[amtMatch.length - 1];
                let amt = parseFloat(last.replace(/[^\d.]/g, ""));
                if (last.includes("만원")) amt *= 10000;
                text = text.replace(last, "").trim() || "기타";
                
                const category = await askGeminiToCategorize(text);
                
                const newEx = { id: Date.now() + Math.random(), year, month, day, item: text, amount: amt, category };
                state.expenses.push(newEx);
            }
        }

        inp.value = '';
        pushToCloud();
        btn.disabled = false;
        loader.style.display = 'none';
        render();
    }

    // --- 나머지 동기화 및 UI 로직 ---
    function initSync() {
        db.ref('/').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                state.expenses = val.expenses ? Object.values(val.expenses) : [];
                state.categories = val.categories || state.categories;
                render();
            }
        });
    }

    function pushToCloud() {
        db.ref('expenses').set(state.expenses);
        db.ref('categories').set(state.categories);
    }

    function render() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        document.getElementById('current-month-display').textContent = `${year}년 ${month}월`;
        let data = state.expenses.filter(ex => ex.year === year && ex.month === month);
        const listEl = document.getElementById('expense-list');
        listEl.innerHTML = '';
        data.sort((a,b) => b.day - a.day).forEach(ex => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${ex.month}/${ex.day}</td><td>${ex.item}</td><td><select class="category-select" onchange="updateExCat(${ex.id}, this.value)">${state.categories.map(c => `<option value="${c}" ${ex.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></td><td>${ex.amount.toLocaleString()}원</td><td><button onclick="deleteEx(${ex.id})" style="border:none; background:none; color:#ccc; cursor:pointer;">✕</button></td>`;
            listEl.appendChild(tr);
        });
        updateStats(data);
    }

    function updateStats(data) {
        const stats = data.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + curr.amount; return acc; }, {});
        const summaryEl = document.getElementById('summary-list');
        summaryEl.innerHTML = '';
        let total = 0;
        Object.entries(stats).sort((a,b) => b[1]-a[1]).forEach(([cat, amt]) => {
            total += amt;
            summaryEl.innerHTML += `<div style="display:flex; justify-content:space-between; padding:5px; font-size:0.9rem;"><span>${cat}</span><span>${amt.toLocaleString()}원</span></div>`;
        });
        document.getElementById('total-display').textContent = `${total.toLocaleString()}원`;
        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (myChart) myChart.destroy();
        if (Object.keys(stats).length > 0) {
            myChart = new Chart(ctx, { type: 'doughnut', data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#4a90e2', '#ff6b6b', '#feca57', '#1dd1a1', '#a29bfe', '#ff9f43', '#ee5253', '#0abde3', '#10ac84', '#576574'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' } });
        }
    }

    function deleteEx(id) { if(confirm('삭제?')) { state.expenses = state.expenses.filter(e => e.id !== id); pushToCloud(); } }
    function updateExCat(id, cat) { state.expenses = state.expenses.map(e => e.id === id ? {...e, category: cat} : e); pushToCloud(); }
    function changeMonth(d) { state.viewDate.setMonth(state.viewDate.getMonth() + d); render(); }
    function openSettings() {
        document.getElementById('settings-modal').style.display = 'flex';
        document.getElementById('category-manager-list').innerHTML = state.categories.map(c => `<div style="display:flex; justify-content:space-between; padding:5px 0;"><span>${c}</span><button onclick="removeCategory('${c}')" style="color:red; border:none; background:none;">삭제</button></div>`).join('');
    }
    function saveApiKey() { const k = document.getElementById('gemini-key-input').value.trim(); if(k) { state.geminiKey = k; localStorage.setItem('sp_gemini_key', k); alert("키 저장 완료!"); openSettings(); } }
    function addCategory() { const v = document.getElementById('new-cat-input').value.trim(); if(v && !state.categories.includes(v)) { state.categories.push(v); pushToCloud(); openSettings(); } }
    function removeCategory(c) { if(state.categories.length > 1 && confirm('삭제?')) { state.categories = state.categories.filter(x => x !== c); pushToCloud(); openSettings(); } }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    function exportToCSV() { const d = state.expenses.filter(ex => ex.year === state.viewDate.getFullYear() && ex.month === (state.viewDate.getMonth()+1)); let csv = "\uFEFF날짜,항목,카테고리,금액\n"; d.forEach(ex => csv += `${ex.year}-${ex.month}-${ex.day},${ex.item},${ex.category},${ex.amount}\n`); const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); link.download = `가계부.csv`; link.click(); }
    function generateAIAnalysis() { alert('데이터 기반 지출 리포트 생성 중...'); }

    window.onload = initSync;
</script>
</body>
</html>
