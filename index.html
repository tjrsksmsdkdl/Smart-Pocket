<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pocket - 실시간 클라우드 가계부</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #4a90e2; --secondary-color: #f5f7fa; --text-color: #333; --accent-color: #ff6b6b; --card-shadow: 0 4px 15px rgba(0,0,0,0.08); --ai-bg: #f8f9ff; }
        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--secondary-color); color: var(--text-color); margin: 0; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        .month-nav { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .month-nav h1 { margin: 0; font-size: 1.6rem; color: var(--primary-color); min-width: 180px; }
        .nav-btn { cursor: pointer; border: none; background: white; padding: 8px 15px; border-radius: 12px; box-shadow: var(--card-shadow); font-weight: bold; }
        .top-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .action-btn { font-size: 0.8rem; padding: 8px 15px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; }
        .input-section { background: white; padding: 25px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 30px; border-top: 5px solid var(--primary-color); }
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; resize: none; min-height: 80px; outline: none; }
        .add-btn { width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .main-content { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; } }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 20px; }
        .card h2 { margin-top: 0; font-size: 1.1rem; margin-bottom: 15px; border-left: 5px solid var(--primary-color); padding-left: 10px; }
        .table-wrapper { overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { position: sticky; top: 0; background: white; padding: 12px; border-bottom: 2px solid #f0f0f0; text-align: left; color: #888; }
        td { padding: 12px; border-bottom: 1px solid #f9f9f9; }
        .category-select { border: none; background: #f0f4f8; padding: 5px; border-radius: 6px; font-size: 0.8rem; width: 100%; }
        .total-amount { font-size: 1.6rem; font-weight: bold; color: var(--primary-color); text-align: right; margin-top: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 95%; max-width: 450px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="month-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
            <h1 id="current-month-display">로딩 중...</h1>
            <button class="nav-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div id="sync-status" style="font-size: 0.75rem; color: #888; margin-bottom: 10px;">데이터 연결 중...</div>
        <div class="top-actions">
            <button class="action-btn" onclick="openSettings()">⚙️ 카테고리 관리</button>
            <button class="action-btn" onclick="exportToCSV()">📤 엑셀 내보내기</button>
            <button class="action-btn" style="background: var(--primary-color); color: white;" onclick="generateAIAnalysis()">✨ AI 분석 리포트</button>
        </div>
    </header>

    <div id="ai-report-box" class="card" style="display:none; background: var(--ai-bg);">
        <h2>✨ AI 분석 리포트</h2>
        <div id="ai-content" style="font-size: 0.9rem;"></div>
    </div>

    <div class="input-section">
        <textarea id="natural-input" placeholder="예: 3/11 택시 4500, 밥 9000"></textarea>
        <button class="add-btn" onclick="handleAdd()">기록하기</button>
    </div>

    <div class="main-content">
        <section class="card">
            <h2>소비 내역</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>날짜</th><th>항목</th><th style="width:120px;">카테고리</th><th>금액</th><th></th></tr>
                    </thead>
                    <tbody id="expense-list"></tbody>
                </table>
            </div>
        </section>

        <div class="stats-side">
            <section class="card">
                <h2>통계</h2>
                <div style="height: 250px;"><canvas id="expenseChart"></canvas></div>
                <div id="summary-list"></div>
                <div id="total-display" class="total-amount">0원</div>
            </section>
            <section class="card">
                <h2>메모</h2>
                <textarea id="month-memo" style="width: 100%; min-height: 80px; border: 1px solid #eee; padding: 10px; border-radius: 12px;" oninput="saveMemo()"></textarea>
            </section>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>카테고리 관리</h3>
        <div id="category-manager-list" style="margin-bottom: 20px; max-height: 250px; overflow-y: auto;"></div>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="new-cat-input" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px;" placeholder="새 이름">
            <button onclick="addCategory()" style="padding:10px; background:var(--primary-color); color:white; border:none; border-radius:8px;">추가</button>
        </div>
        <button onclick="closeSettings()" style="width:100%; margin-top:20px; padding:12px; border-radius:12px; border:none;">닫기</button>
    </div>
</div>

<script>
    // --- 1. Firebase 설정 (URL 주의!) ---
    const firebaseConfig = {
        apiKey: "AIzaSyC7bE0ICTArzvg7qJXHGNdhWPZZtyT6v1c",
        authDomain: "smart-pocket-ea308.firebaseapp.com",
        projectId: "smart-pocket-ea308",
        storageBucket: "smart-pocket-ea308.firebasestorage.app",
        messagingSenderId: "165999635532",
        appId: "1:165999635532:web:d73543e1044437630758e9",
        measurementId: "G-E75HCJPHW3",
        // ★ 만약 콘솔에서 주소가 다르면 아래 주소를 반드시 수정하세요! ★
        databaseURL: "https://smart-pocket-ea308-default-rtdb.asia-southeast1.firebasedatabase.app" 
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = {
        viewDate: new Date(),
        expenses: [],
        // 서버에서 데이터를 받기 전 기본값 설정 (undefined 에러 방지)
        categories: ['식비', '교통비', '쇼핑/미용', '공과금', '취미', '생활용품', '구독/디지털'],
        memos: {},
        filter: null
    };

    let myChart = null;

    // --- 2. 실시간 동기화 ---
    function initSync() {
        db.ref('/').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                state.expenses = val.expenses ? Object.values(val.expenses) : [];
                state.categories = val.categories || state.categories;
                state.memos = val.memos || {};
                document.getElementById('sync-status').textContent = "● 클라우드 동기화 완료";
            } else {
                // 데이터베이스가 아예 비어있을 때 초기값 전송
                pushToCloud();
            }
            render();
        }, (error) => {
            console.error("데이터 로드 실패:", error);
            document.getElementById('sync-status').textContent = "● 연결 오류 (Firebase 규칙 확인 필요)";
        });
    }

    function pushToCloud() {
        // undefined가 포함되지 않도록 검사 후 전송
        const cleanExpenses = state.expenses.filter(ex => ex.category !== undefined);
        db.ref('expenses').set(cleanExpenses);
        db.ref('categories').set(state.categories);
        db.ref('memos').set(state.memos);
    }

    // --- 3. 입력 로직 (에러 방지 강화) ---
    function autoCategorize(text) {
        // 서버에서 카테고리를 못 가져왔을 경우 대비
        const currentCats = (state.categories && state.categories.length > 0) ? state.categories : ['식비'];
        
        const map = {'식비':['밥','카페','식당','마트'],'교통비':['택시','버스','지하철','주유']};
        for (let cat of currentCats) if (text.includes(cat)) return cat;
        for (let [cat, keys] of Object.entries(map)) {
            if (currentCats.includes(cat) && keys.some(k => text.includes(k))) return cat;
        }
        return currentCats[0];
    }

    function handleAdd() {
        const inp = document.getElementById('natural-input');
        if (!inp.value.trim()) return;

        const segments = inp.value.split(/[,|\n]/).map(s => s.trim()).filter(s => s.length > 0);
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        let day = new Date().getDate();

        const results = [];
        segments.forEach(seg => {
            let text = seg;
            const dateMatch = text.match(/(\d{1,2})[월\/](\d{1,2})일?/);
            if (dateMatch) { day = parseInt(dateMatch[2]); text = text.replace(dateMatch[0], "").trim(); }
            
            const amtMatch = text.match(/(\d[\d,.]*)\s*(만원|원)?/g);
            if (amtMatch) {
                const last = amtMatch[amtMatch.length - 1];
                let amt = parseFloat(last.replace(/[^\d.]/g, ""));
                if (last.includes("만원")) amt *= 10000;
                text = text.replace(last, "").trim();
                
                const category = autoCategorize(text);
                // undefined 인지 한 번 더 체크
                if (category) {
                    results.push({ id: Date.now() + Math.random(), year, month, day, item: text || "기타", amount: amt, category });
                }
            }
        });

        if (results.length > 0) {
            state.expenses = [...state.expenses, ...results];
            inp.value = '';
            pushToCloud();
        }
    }

    // --- 4. 렌더링 및 차트 (기존 로직 최적화) ---
    function render() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        document.getElementById('current-month-display').textContent = `${year}년 ${month}월`;

        let data = state.expenses.filter(ex => ex.year === year && ex.month === month);
        if (state.filter) data = data.filter(ex => ex.category === state.filter);

        const listEl = document.getElementById('expense-list');
        listEl.innerHTML = '';
        data.sort((a,b) => b.day - a.day).forEach(ex => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${ex.month}/${ex.day}</td>
                <td>${ex.item}</td>
                <td><select class="category-select" onchange="updateExCat(${ex.id}, this.value)">
                    ${state.categories.map(c => `<option value="${c}" ${ex.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select></td>
                <td>${ex.amount.toLocaleString()}원</td>
                <td><button onclick="deleteEx(${ex.id})" style="border:none; background:none; color:#ccc;">✕</button></td>
            `;
            listEl.appendChild(tr);
        });

        updateStats(data);
        document.getElementById('month-memo').value = state.memos[`${year}-${month}`] || "";
    }

    function updateStats(data) {
        const stats = data.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + curr.amount; return acc; }, {});
        const summaryEl = document.getElementById('summary-list');
        summaryEl.innerHTML = '';
        let total = 0;
        
        Object.entries(stats).sort((a,b) => b[1]-a[1]).forEach(([cat, amt]) => {
            total += amt;
            const div = document.createElement('div');
            div.style.cssText = `display:flex; justify-content:space-between; padding:8px; cursor:pointer; border-radius:8px; font-size:0.9rem; background:${state.filter===cat?'#eef5ff':'transparent'}`;
            div.onclick = () => { state.filter = (state.filter === cat ? null : cat); render(); };
            div.innerHTML = `<span>${cat}</span><span>${amt.toLocaleString()}원</span>`;
            summaryEl.appendChild(div);
        });
        document.getElementById('total-display').textContent = `${total.toLocaleString()}원`;

        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (myChart) myChart.destroy();
        if (Object.keys(stats).length > 0) {
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#4a90e2', '#ff6b6b', '#feca57', '#1dd1a1', '#a29bfe', '#ff9f43', '#ee5253', '#0abde3', '#10ac84', '#576574'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
            });
        }
    }

    // --- 5. 기타 보조 함수 ---
    function deleteEx(id) { if(confirm('삭제?')) { state.expenses = state.expenses.filter(e => e.id !== id); pushToCloud(); } }
    function updateExCat(id, cat) { state.expenses = state.expenses.map(e => e.id === id ? {...e, category: cat} : e); pushToCloud(); }
    function changeMonth(d) { state.viewDate.setMonth(state.viewDate.getMonth() + d); state.filter = null; render(); }
    function saveMemo() { state.memos[`${state.viewDate.getFullYear()}-${state.viewDate.getMonth()+1}`] = document.getElementById('month-memo').value; pushToCloud(); }
    
    // 설정 모달
    function openSettings() {
        document.getElementById('settings-modal').style.display = 'flex';
        document.getElementById('category-manager-list').innerHTML = state.categories.map(c => `
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;">
                <span>${c}</span>
                <button onclick="removeCategory('${c}')" style="color:red; border:none; background:none;">삭제</button>
            </div>
        `).join('');
    }
    function addCategory() {
        const v = document.getElementById('new-cat-input').value.trim();
        if(v && !state.categories.includes(v)) { state.categories.push(v); pushToCloud(); openSettings(); }
    }
    function removeCategory(c) {
        if(state.categories.length > 1) { state.categories = state.categories.filter(x => x !== c); pushToCloud(); openSettings(); }
    }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function exportToCSV() {
        const data = state.expenses.filter(ex => ex.year === state.viewDate.getFullYear() && ex.month === (state.viewDate.getMonth()+1));
        if(data.length === 0) return alert('내역 없음');
        let csv = "\uFEFF날짜,항목,카테고리,금액\n";
        data.forEach(ex => csv += `${ex.year}-${ex.month}-${ex.day},${ex.item},${ex.category},${ex.amount}\n`);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = `가계부.csv`; link.click();
    }

    function generateAIAnalysis() {
        const data = state.expenses.filter(ex => ex.year === state.viewDate.getFullYear() && ex.month === (state.viewDate.getMonth()+1));
        if (data.length === 0) return alert('기록 없음');
        document.getElementById('ai-report-box').style.display = 'block';
        document.getElementById('ai-content').innerHTML = `기록된 데이터를 기반으로 분석 중... (지출 건수: ${data.length}건)`;
    }

    window.onload = initSync;
</script>
</body>
</html>
