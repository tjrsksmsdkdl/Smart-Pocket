<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Pocket - AI 가계부 (Gemini)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #4a90e2; --secondary-color: #f5f7fa; --text-color: #333; --accent-color: #ff6b6b; --card-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: var(--secondary-color); color: var(--text-color); margin: 0; padding: 15px 10px; }
        
        /* 로그인 화면 */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; text-align: center; }
        .google-btn { background: white; color: #444; padding: 15px 30px; border-radius: 15px; border: 1px solid #ddd; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 12px; box-shadow: var(--card-shadow); font-size: 1.1rem; }
        
        /* 메인 컨테이너 */
        .container { max-width: 1100px; margin: 0 auto; width: 100%; display: none; }
        header { text-align: center; margin-bottom: 20px; }
        
        /* 사용자 정보 */
        .user-info { font-size: 0.75rem; color: #888; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .logout-btn { background: none; border: none; color: #ff6b6b; cursor: pointer; text-decoration: underline; font-size: 0.75rem; padding: 0; }

        .month-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .month-nav h1 { margin: 0; font-size: 1.5rem; color: var(--primary-color); min-width: 160px; }
        .nav-btn { cursor: pointer; border: none; background: white; padding: 10px 15px; border-radius: 12px; box-shadow: var(--card-shadow); font-weight: bold; }
        
        .action-btn { font-size: 0.8rem; padding: 8px 15px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; }
        
        /* 공통 카드 */
        .card, .input-section { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 20px; width: 100%; }
        .input-section { border-top: 5px solid var(--primary-color); }
        textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; resize: none; min-height: 90px; outline: none; }
        .add-btn { width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 12px; font-size: 1rem; }

        .main-content { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; width: 100%; }
        @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; gap: 0; } }

        /* 지출 내역 헤더 및 리스트 */
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .list-wrapper { overflow-y: auto; max-height: 800px; transition: all 0.3s ease; }
        .list-wrapper.collapsed { display: none; }
        
        .date-group { margin-bottom: 25px; }
        .date-header { display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 5px; border-bottom: 1px solid #eee; margin-bottom: 8px; }
        .date-left { display: flex; align-items: center; gap: 10px; }
        .date-num { font-size: 1.8rem; font-weight: bold; color: #333; line-height: 1; }
        .date-day-badge { padding: 3px 10px; border-radius: 6px; color: white; font-size: 0.8rem; font-weight: bold; }
        .date-ym { font-size: 0.85rem; color: #999; }
        .date-total { font-size: 1.1rem; font-weight: bold; color: #333; }

        .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 5px; border-bottom: 1px solid #f9f9f9; }
        .item-info { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }

        /* 카테고리 박스: 폭 고정 (모바일 포함) */
        .item-category-box {
            flex: 0 0 90px;
            max-width: 90px;
        }

        .category-select-mini {
            border: none;
            background: #f0f4f8;
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 5px;
            color: #777;
            width: 100%;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        /* 항목 이름: 최대 2줄까지 표시 후 잘림 */
        .item-name {
            font-size: 0.95rem;
            color: #333;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;        /* 최대 2줄 */
            -webkit-box-orient: vertical;
            white-space: normal;
            line-height: 1.2;
        }

        .item-right { display: flex; align-items: center; gap: 12px; }
        .item-amount { font-size: 1.1rem; font-weight: 500; color: #333; }
        .item-delete { color: #ddd; cursor: pointer; font-size: 1rem; padding: 0 5px; }

        /* 통계 및 분석 */
        .total-amount { font-size: 1.6rem; font-weight: bold; color: var(--primary-color); text-align: right; margin-top: 20px; }
        .memo-box { width: 100%; min-height: 100px; border: 1px dashed #ddd; border-radius: 12px; padding: 12px; font-size: 0.9rem; background: #fffdf0; resize: none; outline: none; margin-top: 10px; }
        .ai-feedback-container { background: #f0f7ff; border-radius: 15px; padding: 15px; margin-top: 15px; border-left: 5px solid var(--primary-color); font-size: 0.85rem; line-height: 1.6; }
        .feedback-btn { width: 100%; padding: 12px; background: #6c5ce7; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 500px; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color: var(--primary-color); font-size: 2.5rem; margin-bottom: 10px;">Smart Pocket</h1>
    <p style="color: #666; margin-bottom: 40px;">AI와 함께하는 스마트 가계부</p>
    <button class="google-btn" onclick="login()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="22">
        Google 로그인
    </button>
</div>

<div class="container" id="main-container">
    <header>
        <div class="user-info">
            <span id="display-name"></span>님 환영합니다
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
        <div class="month-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
            <h1 id="current-month-display"></h1>
            <button class="nav-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div id="sync-status" style="font-size: 0.7rem; color: #2ecc71; margin-bottom: 10px;">● Cloud Syncing...</div>
        <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 15px;">
            <button class="action-btn" onclick="openSettings()">⚙️ 설정</button>
            <button class="action-btn" onclick="exportToCSV()">📤 CSV 내보내기</button>
        </div>
    </header>

    <div class="input-section">
        <textarea id="natural-input" placeholder="예: 3/11 택시 4500, 스타벅스 5000"></textarea>
        <button id="add-btn" class="add-btn" onclick="handleAdd()">기록하기 (Gemini 분석)</button>
        <div id="ai-loader" style="display:none; text-align:center; font-size:0.8rem; color:var(--primary-color); margin-top:8px;">AI 분석 중...</div>
    </div>

    <div class="main-content">
        <section class="card">
            <div class="table-header">
                <h3 style="margin:0; font-size: 1.1rem;">📋 지출 내역</h3>
                <button class="action-btn" id="toggle-list-btn" onclick="toggleList()">숨기기</button>
            </div>
            <div class="list-wrapper" id="list-wrapper">
                <div id="expense-list"></div>
            </div>
        </section>

        <div class="stats-side">
            <section class="card">
                <div style="height: 220px; cursor: pointer;"><canvas id="expenseChart"></canvas></div>
                <div id="summary-list" style="margin-top: 15px;"></div>
                <div id="total-display" class="total-amount">0원</div>
            </section>
            <section class="card">
                <h3 style="margin:0; font-size: 1rem;">📝 월별 메모</h3>
                <textarea id="month-memo" class="memo-box" placeholder="이달의 메모..." oninput="handleMemoInput()"></textarea>
            </section>
            <section class="card">
                <h3 style="margin:0; font-size: 1rem;">💡 AI 소비 분석</h3>
                <div id="ai-feedback-text" class="ai-feedback-container">내역을 입력하고 피드백을 받아보세요.</div>
                <button id="feedback-btn" class="feedback-btn" onclick="getAIFeedback()">이달의 피드백 받기</button>
            </section>
        </div>
    </div>
</div>

<div id="category-detail-modal" class="modal" onclick="if(event.target==this) closeDetailModal()">
    <div class="modal-content">
        <h3 id="detail-title" style="color: var(--primary-color); margin-top: 0;">상세 내역</h3>
        <div id="detail-list-content" style="max-height: 350px; overflow-y: auto; margin-bottom: 15px;"></div>
        <button onclick="closeDetailModal()" style="width:100%; padding:12px; background:#f0f0f0; border:none; border-radius:12px; font-weight: bold;">닫기</button>
    </div>
</div>

<div id="settings-modal" class="modal" onclick="if(event.target==this) closeSettings()">
    <div class="modal-content">
        <h3>설정</h3>
        <p id="uid-display" style="font-size: 0.6rem; color: #ccc; word-break: break-all; margin-bottom: 15px;"></p>
        <label style="font-size:0.85rem; font-weight:bold;">카테고리 관리</label>
        <div id="category-manager-list" style="margin: 10px 0; max-height: 150px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 10px;"></div>
        <div style="display: flex; gap: 5px; margin-bottom: 20px;">
            <input type="text" id="new-cat-input" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:8px;" placeholder="새 항목">
            <button onclick="addCategory()" style="padding:8px 15px; background:var(--primary-color); color:white; border:none; border-radius:8px;">추가</button>
        </div>
        <label style="font-size:0.85rem; font-weight:bold;">Gemini API Key</label>
        <div id="key-status-msg" style="font-size:0.75rem; color:#888; margin-bottom:5px;"></div>
        <div style="display: flex; gap: 5px;">
            <input type="password" id="gemini-key-input" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:8px;" placeholder="AIzaSy...">
            <button onclick="saveApiKey()" style="padding:8px 15px; background:#444; color:white; border:none; border-radius:8px;">저장</button>
        </div>
        <button onclick="closeSettings()" style="width:100%; margin-top:20px; padding:12px; background:#f0f0f0; border:none; border-radius:12px; font-weight: bold;">닫기</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC7bE0ICTArzvg7qJXHGNdhWPZZtyT6v1c",
        authDomain: "smart-pocket-ea308.firebaseapp.com",
        projectId: "smart-pocket-ea308",
        storageBucket: "smart-pocket-ea308.firebasestorage.app",
        messagingSenderId: "165999635532",
        appId: "1:165999635532:web:d73543e1044437630758e9",
        measurementId: "G-E75HCJPHW3",
        databaseURL: "https://smart-pocket-ea308-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    let state = {
        currentUser: null,
        viewDate: new Date(),
        expenses: [],
        categories: ['식비', '교통비', '쇼핑/미용', '공과금', '취미', '생활용품', '구독/디지털'],
        memos: {},
        geminiKey: localStorage.getItem('sp_gemini_key') || "" 
    };

    let myChart = null;

    const classifyModelName = "gemini-2.5-flash-lite";
    const feedbackModelName = "gemini-2.5-flash";

    function login() { auth.signInWithRedirect(provider); }
    function logout() { if(confirm("로그아웃 하시겠습니까?")) auth.signOut().then(() => location.reload()); }

    auth.onAuthStateChanged((user) => {
        if (user) {
            state.currentUser = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
            document.getElementById('display-name').textContent = user.displayName;
            document.getElementById('uid-display').textContent = "UID: " + user.uid;
            render(); 
            initSync();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-container').style.display = 'none';
        }
    });

    function getUserRef() { return db.ref('users/' + state.currentUser.uid); }

    function initSync() {
        getUserRef().on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                state.expenses = val.expenses ? Object.values(val.expenses) : [];
                state.categories = val.categories || state.categories;
                state.memos = val.memos || {};
                render();
            }
        });
    }

    function pushToCloud() {
        if(!state.currentUser) return;
        getUserRef().set({ expenses: state.expenses, categories: state.categories, memos: state.memos });
    }

    function toggleList() {
        const wrapper = document.getElementById('list-wrapper');
        const btn = document.getElementById('toggle-list-btn');
        if (wrapper.style.display === 'none') {
            wrapper.style.display = 'block';
            btn.textContent = "숨기기";
        } else {
            wrapper.style.display = 'none';
            btn.textContent = "보기";
        }
    }

    async function callGemini(prompt, modelName) {
        if (!state.geminiKey) return null;
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${state.geminiKey}`;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            if (!data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) return null;
            return data.candidates[0].content.parts[0].text.trim();
        } catch (e) {
            return null;
        }
    }

    async function handleAdd() {
        const inp = document.getElementById('natural-input');
        if (!inp.value.trim()) return;
        const loader = document.getElementById('ai-loader');
        const btn = document.getElementById('add-btn');
        btn.disabled = true; loader.style.display = 'block';

        const segments = inp.value.split(/[,|\n]/).map(s => s.trim()).filter(s => s.length > 0);
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        let day = new Date().getDate();

        for (const seg of segments) {
            let text = seg;

            const dateMatch = text.match(/(\d{1,2})[월\/](\d{1,2})일?/);
            if (dateMatch) { 
                day = parseInt(dateMatch[2]); 
                text = text.replace(dateMatch[0], "").trim(); 
            }

            const amtMatch = text.match(/(\d[\d,.]*)\s*(만원|원)?/g);
            if (amtMatch) {
                const last = amtMatch[amtMatch.length - 1];
                let amt = parseFloat(last.replace(/[^\d.]/g, ""));
                if (last.includes("만원")) amt *= 10000;
                text = text.replace(last, "").trim() || "기타";

                const catPrompt = `"${text}"를 [${state.categories.join(", ")}] 중 하나로 분류해. 카테고리 이름만 한 단어로 답해.`;
                const cleanedText = await callGemini(catPrompt, classifyModelName);
                const category = state.categories.includes(cleanedText) ? cleanedText : state.categories[0];

                state.expenses.push({ id: Date.now() + Math.random(), year, month, day, item: text, amount: amt, category });
            }
        }

        inp.value = '';
        pushToCloud();
        btn.disabled = false;
        loader.style.display = 'none';
        render();
    }

    function render() {
        const year = state.viewDate.getFullYear();
        const month = state.viewDate.getMonth() + 1;
        const display = document.getElementById('current-month-display');
        if (display) display.textContent = `${year}년 ${month}월`;

        const memoKey = `${year}-${month}`;
        document.getElementById('month-memo').value = state.memos[memoKey] || "";

        const data = state.expenses.filter(ex => ex.year === year && ex.month === month);
        const listEl = document.getElementById('expense-list');
        listEl.innerHTML = '';

        const groups = data.reduce((acc, ex) => {
            if (!acc[ex.day]) acc[ex.day] = { items: [], total: 0 };
            acc[ex.day].items.push(ex); 
            acc[ex.day].total += ex.amount;
            return acc;
        }, {});

        const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

        Object.keys(groups).sort((a, b) => b - a).forEach(day => {
            const group = groups[day];
            const dayIdx = new Date(year, month - 1, day).getDay();
            let dayColor = dayIdx === 0 ? '#ff6b6b' : (dayIdx === 6 ? '#4a90e2' : '#888');

            const groupDiv = document.createElement('div');
            groupDiv.className = 'date-group';
            groupDiv.innerHTML = `
                <div class="date-header">
                    <div class="date-left">
                        <span class="date-num">${day}</span>
                        <span class="date-day-badge" style="background-color: ${dayColor}">${dayNames[dayIdx]}</span>
                        <span class="date-ym">${year}.${month}</span>
                    </div>
                    <div class="date-total">${group.total.toLocaleString()}원</div>
                </div>
                ${
                    group.items.map(ex => `
                        <div class="expense-item">
                            <div class="item-info">
                                <div class="item-category-box">
                                    <select class="category-select-mini" onchange="updateExCat(${ex.id}, this.value)">
                                        ${state.categories.map(c => `<option value="${c}" ${ex.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                                    </select>
                                </div>
                                <span class="item-name">${ex.item}</span>
                            </div>
                            <div class="item-right">
                                <span class="item-amount">${ex.amount.toLocaleString()}원</span>
                                <span class="item-delete" onclick="deleteEx(${ex.id})">✕</span>
                            </div>
                        </div>
                    `).join('')
                }`;
            listEl.appendChild(groupDiv);
        });

        updateStats(data);
    }

    function updateStats(data) {
        const stats = data.reduce((acc, curr) => { 
            acc[curr.category] = (acc[curr.category] || 0) + curr.amount; 
            return acc; 
        }, {});

        const summaryEl = document.getElementById('summary-list');
        summaryEl.innerHTML = ''; 
        let total = 0;
        Object.values(stats).forEach(amt => total += amt);

        Object.entries(stats).sort((a,b) => b[1]-a[1]).forEach(([cat, amt]) => {
            const percent = total > 0 ? ((amt / total) * 100).toFixed(1) : 0;
            summaryEl.innerHTML += `
                <div onclick="showCategoryDetails('${cat}')" style="display:flex; justify-content:space-between; padding:8px 5px; font-size:0.9rem; border-bottom:1px solid #f0f0f0; cursor:pointer;">
                    <span>${cat} <small style="color:#aaa;">(${percent}%)</small></span>
                    <span style="font-weight:bold;">${amt.toLocaleString()}원</span>
                </div>`;
        });

        document.getElementById('total-display').textContent = `${total.toLocaleString()}원`;

        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (myChart) myChart.destroy();
        if (Object.keys(stats).length > 0) {
            myChart = new Chart(ctx, { 
                type: 'doughnut', 
                data: { 
                    labels: Object.keys(stats), 
                    datasets: [{ 
                        data: Object.values(stats), 
                        backgroundColor: ['#4a90e2', '#ff6b6b', '#feca57', '#1dd1a1', '#a29bfe', '#ff9f43', '#ee5253', '#0abde3', '#10ac84', '#576574'], 
                        borderWidth: 0 
                    }] 
                }, 
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } }, 
                    cutout: '75%', 
                    onClick: (evt, elements) => { 
                        if (elements.length > 0) showCategoryDetails(myChart.data.labels[elements[0].index]); 
                    } 
                } 
            });
        }
    }

    function showCategoryDetails(cat) {
        const year = state.viewDate.getFullYear(); 
        const month = state.viewDate.getMonth() + 1;
        const filtered = state.expenses.filter(ex => ex.year === year && ex.month === month && ex.category === cat);
        document.getElementById('detail-title').textContent = `${cat} 상세 내역`;
        document.getElementById('detail-list-content').innerHTML = filtered
            .sort((a,b) => b.day-a.day)
            .map(ex => `
                <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee;">
                    <span>${ex.month}/${ex.day} ${ex.item}</span>
                    <span style="font-weight:bold;">${ex.amount.toLocaleString()}원</span>
                </div>
            `).join('');
        document.getElementById('category-detail-modal').style.display = 'flex';
    }

    function closeDetailModal() { document.getElementById('category-detail-modal').style.display = 'none'; }
    function changeMonth(d) { state.viewDate.setMonth(state.viewDate.getMonth() + d); render(); }
    function deleteEx(id) { if(confirm('삭제하시겠습니까?')) { state.expenses = state.expenses.filter(e => e.id !== id); pushToCloud(); render(); } }
    function updateExCat(id, cat) { state.expenses = state.expenses.map(e => e.id === id ? {...e, category: cat} : e); pushToCloud(); render(); }
    function handleMemoInput() { 
        const key = `${state.viewDate.getFullYear()}-${state.viewDate.getMonth() + 1}`; 
        state.memos[key] = document.getElementById('month-memo').value; 
        pushToCloud(); 
    }

    async function getAIFeedback() { 
        const year = state.viewDate.getFullYear(); 
        const month = state.viewDate.getMonth() + 1;
        const currentData = state.expenses.filter(ex => ex.year === year && ex.month === month);
        if (currentData.length === 0) return;

        document.getElementById('ai-feedback-text').innerText = "분석 중...";

        const dataSummary = currentData.map(d => `${d.item}(${d.category}): ${d.amount}원`).join(", ");

        const prompt = `너는 친절한 한국인 재무 상담가야. 다음 한 달 소비내역을 보고 1) 잘한 점, 2) 아쉬운 점, 3) 다음 달을 위한 구체적인 실천 팁을 각 항목별로 간단히 bullet으로 정리해서 말해줘. 너무 길게 쓰지 말고 핵심만 말해줘.
[소비 내역] ${dataSummary}`;

        const result = await callGemini(prompt, feedbackModelName);
        document.getElementById('ai-feedback-text').innerText = result || "AI 키 또는 모델 설정을 확인해주세요.";
    }

    function openSettings() { 
        document.getElementById('settings-modal').style.display = 'flex'; 
        const list = document.getElementById('category-manager-list'); 
        list.innerHTML = state.categories
            .map(c => `
                <div style="display:flex; justify-content:space-between; padding:5px 0;">
                    <span>${c}</span>
                    <button onclick="removeCategory('${c}')" style="color:#ff6b6b; border:none; background:none;">삭제</button>
                </div>
            `).join(''); 
    }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

    function saveApiKey() { 
        const k = document.getElementById('gemini-key-input').value.trim(); 
        if(k) { 
            state.geminiKey = k; 
            localStorage.setItem('sp_gemini_key', k); 
            alert("Gemini API Key가 저장되었습니다."); 
            openSettings(); 
        } 
    }

    function addCategory() { 
        const v = document.getElementById('new-cat-input').value.trim(); 
        if(v && !state.categories.includes(v)) { 
            state.categories.push(v); 
            pushToCloud(); 
            openSettings(); 
            document.getElementById('new-cat-input').value = "";
        } 
    }

    function removeCategory(c) { 
        if(state.categories.length > 1 && confirm('정말 이 카테고리를 삭제하시겠습니까?')) { 
            state.categories = state.categories.filter(x => x !== c); 
            pushToCloud(); 
            openSettings(); 
        } 
    }

    function exportToCSV() {
        const year = state.viewDate.getFullYear(); 
        const month = state.viewDate.getMonth() + 1;
        const currentData = state.expenses.filter(ex => ex.year === year && ex.month === month);
        const stats = currentData.reduce((acc, curr) => { 
            acc[curr.category] = (acc[curr.category] || 0) + curr.amount; 
            return acc; 
        }, {});
        const totalAmount = Object.values(stats).reduce((a, b) => a + b, 0);
        const statsArray = Object.entries(stats).sort((a,b) => b[1]-a[1]);

        let csv = "\uFEFF날짜,항목,카테고리,금액,,[요약],금액,비중\n";
        for (let i = 0; i < Math.max(currentData.length, statsArray.length + 1); i++) {
            let row = [];
            if (i < currentData.length) { 
                const ex = currentData[i]; 
                row.push(`${ex.year}-${ex.month}-${ex.day}`, `"${ex.item}"`, ex.category, ex.amount); 
            } else row.push("", "", "", "");
            row.push("");
            if (i < statsArray.length) { 
                const [cat, amt] = statsArray[i]; 
                row.push(cat, amt, ((amt / totalAmount) * 100).toFixed(1) + "%"); 
            }
            else if (i === statsArray.length && totalAmount > 0) 
                row.push("총합", totalAmount, "100%");
            csv += row.join(",") + "\n";
        }

        const link = document.createElement("a"); 
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = `${year}_${month}_가계부.csv`; 
        link.click();
    }
</script>
</body>
</html>
